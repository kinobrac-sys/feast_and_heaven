{% extends "base.html" %}
    {% block content %}
    <h1>{{ dish.name }}</h1>
        <div class="row">
            <div class="col-12 col-md-6">
                <div class="card">
                
                <div class="card-body">
                    <h5 class="card-title"><span class="text text-warning">Блюдо номер {{ dish.numeration }}</span></h5>
                    <p class="card-text">{{ dish.description }}</p>
                </div>
                </div>
            </div>  
            <div class="col"><img src="{{dish.image.url}}" class="card-img-top" alt="q"></div>
  {% endblock %}
