{% extends "base.html" %}
    {% block content %}
    <h1>Кошик</h1>
    
<div class="list-group">
  {% for shopcart in shopcarts %}


    
    <div href="{% url "main_page" %}" class="list-group-item d-flex justify-content-between align-items-center bg-success p-2 text-dark bg-opacity-10" 
    aria-current="true">
    <a>{{ shopcart.item }},      {{ shopcart.quantity }} шт.</a>
      <div>
        <a class="tip_text">  </a>
      <span>Загальна вартість: {{shopcart.get_total_price }} ₴ </span>
      <a href="{% url 'shopcart-update' shopcart.pk %}" class="btn btn-secondary"><i class="bi bi-arrow-clockwise"></i></a>
      <a href="{% url 'shopcart-delete' shopcart.pk %}" class="btn btn-danger"><i class="bi bi-trash"></i></a>
      </div>
</div>
{% endfor %}
</div>
<div class="alert alert-dark" role="alert" style="max-width: 230px; margin-top: 20px; max-height: 100px;" class="my-2 ms-auto">Загальна вартість: {{ total_price }} ₴</div>
<a href="{% url 'order' %}" class="btn btn-secondary my-2 ms-auto " style="max-width: 200px;">Створити замовлення</a>
    {% endblock %}
